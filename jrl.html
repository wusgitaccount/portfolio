<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JRL Birthday Loop</title>

<style>
  :root{
    --bg: #ffffff;
    --ink: #001930;
    --muted: #766E60;
    --line-color: #656464;
    --line-color-soft: #8e8685;
    --gold: #D9A441;
    --card-bg: #FFFFFF;
    --ring: #1C2430;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: proxima-nova, sans-serif;
    font-style: normal;
    font-weight: 100;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }

  header {
    
    margin-bottom: 8px;
  }

  .kicker {
    font-family: proxima-nova, sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin: 0 0 14px;
  }

  h1 {
    font-family: proxima-nova, sans-serif;
    font-size: clamp(2rem, 5vw, 2.9rem);
    line-height: 1.1;
    margin: 0 0 14px;
  }

  .diagram {
    margin: 40px auto 8px;
    max-width: 760px;
  }

  .diagram svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
    
  }

  .stop-name {
    font-family: proxima-nova, sans-serif;
    font-weight: 700;
    font-size: 21px;
    fill: var(--ink);
  }

  .stop-place {
    font-family: proxima-nova, sans-serif;
    font-style: italic;
    font-size: 17px;
    fill: var(--ink);
  }

  .stop-note {
    font-family: proxima-nova, sans-serif;
    font-size: 13.5px;
    fill: var(--muted);
  }

  .legend {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 28px;
    color: var(--muted);
    font-size: 0.85rem;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-family: proxima-nova, sans-serif;
    font-style: italic;
    color: var(--muted);
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="kicker">Tāmaki Makaurau, City Rail Link</p>
    <h1>JRL Jordan Reid Lewis</h1>
    <p>Happy Birthday :3</p>
  </header>

  <div class="diagram">
    <svg viewBox="-20 140 1120 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Line map of seven rail stations with a place marked at each stop">

      <!-- the line, 7 stops evenly spaced along it -->
      <line x1="60" y1="340" x2="1040" y2="340"
            stroke="var(--line-color)" stroke-width="3" stroke-dasharray="1 10"
            stroke-linecap="round" />

      <!-- === MAUNGAWHAU / MT EDEN === -->
      <g>
        <line x1="100" y1="340" x2="100" y2="250" stroke="var(--line-color-soft)" stroke-width="2" stroke-dasharray="4 4" />
        <circle cx="100" cy="340" r="13" fill="var(--card-bg)" stroke="var(--ring)" stroke-width="4" />
        <text x="100" y="180" text-anchor="middle" class="stop-note">Beer to start, 3 min walk</text>
        <text x="100" y="200" text-anchor="middle" class="stop-place">Small Gods Taproom</text>
        <text x="100" y="225" text-anchor="middle" class="stop-name">Maungawhau</text>
      </g>

      <!-- === KARANGA-A-HAPE / K RD === -->
      <g>
        <line x1="250" y1="340" x2="250" y2="430" stroke="var(--line-color-soft)" stroke-width="2" stroke-dasharray="4 4" />
        <circle cx="250" cy="340" r="13" fill="var(--card-bg)" stroke="var(--ring)" stroke-width="4" />
        <text x="250" y="458" text-anchor="middle" class="stop-name">Karanga-a-Hape</text>
        <text x="250" y="481" text-anchor="middle" class="stop-place">No. 7</text>
        <text x="250" y="500" text-anchor="middle" class="stop-note">Arrive between 4-6pm for happy hour, 1 min walk</text>
      </g>

      <!-- === TE WAIHOROTIU / AOTEA === -->
      <g>
        <line x1="400" y1="340" x2="400" y2="250" stroke="var(--line-color-soft)" stroke-width="2" stroke-dasharray="4 4" />
        <circle cx="400" cy="340" r="13" fill="var(--card-bg)" stroke="var(--ring)" stroke-width="4" />
        <text x="400" y="180" text-anchor="middle" class="stop-note">Birthday cake, 4 min walk</text>
        <text x="400" y="200" text-anchor="middle" class="stop-place">Fed Street Deli</text>
        <text x="400" y="225" text-anchor="middle" class="stop-name">Te Waihorotiu</text>
      </g>

      <!-- === WAITEMATĀ / BRITOMART === -->
      <g>
        <line x1="550" y1="340" x2="550" y2="430" stroke="var(--line-color-soft)" stroke-width="2" stroke-dasharray="4 4" />
        <circle cx="550" cy="340" r="13" fill="var(--card-bg)" stroke="var(--ring)" stroke-width="4" />
        <text x="550" y="458" text-anchor="middle" class="stop-name">Waitematā</text>
        <text x="550" y="481" text-anchor="middle" class="stop-place"></text>
        <text x="550" y="500" text-anchor="middle" class="stop-note"></text>
      </g>

      <!-- === PARNELL === -->
      <g>
        <line x1="700" y1="340" x2="700" y2="250" stroke="var(--line-color-soft)" stroke-width="2" stroke-dasharray="4 4" />
        <circle cx="700" cy="340" r="13" fill="var(--card-bg)" stroke="var(--ring)" stroke-width="4" />
        <text x="700" y="180" text-anchor="middle" class="stop-note"></text>
        <text x="700" y="200" text-anchor="middle" class="stop-place"></text>
        <text x="700" y="225" text-anchor="middle" class="stop-name">Parnell</text>
      </g>

      <!-- === NEWMARKET === -->
      <g>
        <line x1="850" y1="340" x2="850" y2="430" stroke="var(--line-color-soft)" stroke-width="2" stroke-dasharray="4 4" />
        <circle cx="850" cy="340" r="13" fill="var(--card-bg)" stroke="var(--ring)" stroke-width="4" />
        <text x="850" y="458" text-anchor="middle" class="stop-name">Newmarket</text>
        <text x="850" y="481" text-anchor="middle" class="stop-place">Subtype</text>
        <text x="850" y="500" text-anchor="middle" class="stop-note">8 min walk</text>
      </g>

      <!-- === GRAFTON === -->
      <g>
        <line x1="1000" y1="340" x2="1000" y2="250" stroke="var(--line-color-soft)" stroke-width="2" stroke-dasharray="4 4" />
        <circle cx="1000" cy="340" r="13" fill="var(--card-bg)" stroke="var(--ring)" stroke-width="4" />
        <text x="1000" y="180" text-anchor="middle" class="stop-note"></text>
        <text x="1000" y="200" text-anchor="middle" class="stop-place"></text>
        <text x="1000" y="225" text-anchor="middle" class="stop-name">Grafton</text>
      </g>

    </svg>
  </div>

  <div class="legend">
    <a href="https://maps.app.goo.gl/1jSUuFwbWHgiTaMN6" target="_blank">View on Google Maps</a>
  </div>

  <footer> </footer>

</div>
</body>
</html>
